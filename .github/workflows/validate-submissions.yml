name: Validate Participant Submissions

on:
  push:
    paths:
      - 'participants/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deliverables
        id: validate
        shell: bash
        run: |
          REQUIRED_FILES=(
            "01-problem-statement"
            "02-system-architecture"
            "03-electrical-design"
            "04-mechanical-design"
            "05-firmware-logic"
            "06-simulation-validation"
            "07-pitch-deck"
          )

          RESULTS=""
          ALL_PASS=true

          for PARTICIPANT_DIR in participants/*/; do
            NAME=$(basename "$PARTICIPANT_DIR")
            # Skip the example template folder
            if [ "$NAME" = "example-participant" ]; then
              continue
            fi

            DELIVERABLES_DIR="${PARTICIPANT_DIR}deliverables"
            MISSING=()
            PRESENT=()

            for REQUIRED in "${REQUIRED_FILES[@]}"; do
              # Accept any file extension matching the required prefix
              FOUND=$(find "$DELIVERABLES_DIR" -maxdepth 1 -name "${REQUIRED}*" 2>/dev/null | head -1)
              if [ -n "$FOUND" ]; then
                PRESENT+=("✅ $REQUIRED")
              else
                MISSING+=("❌ $REQUIRED")
              fi
            done

            README_FOUND=$([ -f "${PARTICIPANT_DIR}README.md" ] && echo "✅" || echo "❌")

            STATUS="PASS"
            if [ ${#MISSING[@]} -gt 0 ]; then
              STATUS="INCOMPLETE"
              ALL_PASS=false
            fi

            RESULTS="${RESULTS}### 📁 ${NAME} — ${STATUS}\n"
            RESULTS="${RESULTS}**README.md:** ${README_FOUND}\n\n"
            for P in "${PRESENT[@]}"; do RESULTS="${RESULTS}- ${P}\n"; done
            for M in "${MISSING[@]}"; do RESULTS="${RESULTS}- ${M}\n"; done
            RESULTS="${RESULTS}\n"
          done

          if [ -z "$RESULTS" ]; then
            RESULTS="No participant folders found (excluding example-participant)."
          fi

          # Escape for GitHub Actions output
          echo "results<<EOF" >> $GITHUB_OUTPUT
          printf "%b" "$RESULTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "all_pass=$ALL_PASS" >> $GITHUB_OUTPUT

      - name: Find tracking issue
        id: find-issue
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'submission-tracker',
              state: 'open',
              per_page: 1,
            });
            if (issues.data.length > 0) {
              return issues.data[0].number;
            }
            return null;
          result-encoding: string

      - name: Comment on tracking issue
        if: steps.find-issue.outputs.result != 'null'
        uses: actions/github-script@v7
        env:
          RESULTS: ${{ steps.validate.outputs.results }}
          ALL_PASS: ${{ steps.validate.outputs.all_pass }}
          COMMIT_SHA: ${{ github.sha }}
          PUSHER: ${{ github.actor }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER || '${{ steps.find-issue.outputs.result }}');
            const allPass = process.env.ALL_PASS === 'true';
            const summary = allPass ? '✅ All validated folders have complete deliverables.' : '⚠️ Some deliverables are missing.';
            const body = [
              `## Submission Update — Push by @${process.env.PUSHER}`,
              '',
              `**Commit:** \`${process.env.COMMIT_SHA.slice(0,7)}\`  `,
              `**Status:** ${summary}`,
              '',
              process.env.RESULTS,
              '---',
              `*Auto-generated by the submission validator workflow*`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt('${{ steps.find-issue.outputs.result }}'),
              body,
            });
