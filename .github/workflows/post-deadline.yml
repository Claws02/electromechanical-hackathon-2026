name: Post-Deadline Scoring Setup

# Manually triggered by the organizer at T+24h.
# Also has a scheduled trigger at the hackathon deadline (May 19 at 17:00 UTC).
# Adjust the cron schedule to match your local timezone offset if needed.
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run even if before deadline'
        required: false
        default: 'false'
  schedule:
    # May 19, 2026 at 17:00 UTC — adjust to match your start time + 24h
    - cron: '0 17 19 5 *'

jobs:
  create-scoring-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover participant folders
        id: discover
        shell: bash
        run: |
          PARTICIPANTS=""
          for DIR in participants/*/; do
            NAME=$(basename "$DIR")
            if [ "$NAME" != "example-participant" ]; then
              PARTICIPANTS="${PARTICIPANTS}${NAME},"
            fi
          done
          # Strip trailing comma
          PARTICIPANTS="${PARTICIPANTS%,}"
          echo "participants=$PARTICIPANTS" >> $GITHUB_OUTPUT

      - name: Create scoring issue per participant
        uses: actions/github-script@v7
        env:
          PARTICIPANTS: ${{ steps.discover.outputs.participants }}
        with:
          script: |
            const participantList = process.env.PARTICIPANTS.split(',').filter(Boolean);
            const repoBase = `https://github.com/${context.repo.owner}/${context.repo.repo}/tree/main/participants/`;
            const scoringTemplate = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'admin/scoring-sheet.md',
            });
            const template = Buffer.from(scoringTemplate.data.content, 'base64').toString('utf8');

            for (const participant of participantList) {
              const body = [
                `# Scoring Sheet: ${participant}`,
                '',
                `**Submission folder:** [${repoBase}${participant}/](${repoBase}${participant}/)`,
                '',
                '---',
                '',
                template,
              ].join('\n');

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[SCORING] ${participant}`,
                body,
                labels: ['scoring'],
              });

              console.log(`Created scoring issue for: ${participant}`);
            }

      - name: Post deadline announcement
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '# Hackathon Complete — Judging Has Begun',
              '',
              'The 24-hour submission window is now closed. All commits after this point will not be considered for judging.',
              '',
              '## What Happens Next',
              '1. Individual scoring issues have been created for each participant (labeled `scoring`).',
              '2. Each judge should fill in and submit their scoring issue.',
              '3. The organizer will tally scores and announce the winner.',
              '',
              '## Results Timeline',
              '- Score submissions due: within 48 hours',
              '- Winner announced: via pinned issue',
              '',
              '---',
              '*This message was auto-generated by the post-deadline workflow.*',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🏁 Hackathon Deadline Reached — Judging Open',
              body,
              labels: ['announcement'],
            });
