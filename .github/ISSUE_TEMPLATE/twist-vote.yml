name: Hour 12 Twist Vote (manual fallback)
description: >-
  FALLBACK ONLY. The twist-vote workflow normally posts this automatically at T+12h.
  Use this template only if Actions is unavailable.
title: "⚡ HOUR 12 TWIST VOTE — React 👍 to choose your constraint"
labels: ["twist-vote"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        > ### ⚠️ You probably do not need this template
        >
        > The [`twist-vote`](../../blob/main/.github/workflows/twist-vote.yml) workflow posts the
        > vote issue automatically at T+12h, with all 16 constraints as separate comments ready
        > to react to. Run it from the **Actions** tab (`workflow_dispatch`) rather than filling
        > this in by hand.
        >
        > Use this template **only** if Actions is down or the workflow failed. If you do, you
        > must also post the 16 constraint comments yourself — copy them from
        > [`admin/twists.json`](../../blob/main/admin/twists.json), formatted as
        > `` ## `ID` — Name `` so the tally workflow can still match them.
        >
        > The label `twist-vote` is required either way — both tally paths look for it.

  - type: markdown
    attributes:
      value: |
        # ⚡ Hour 12 Twist Vote

        **Rules**
        - One vote each. React 👍 to exactly **one** constraint comment below.
        - Reacting to more than one **voids your whole ballot**, and the tally names you.
        - Voting closes 30 minutes after this issue is posted.
        - The winner applies to **every** design for the final 12 hours.
        - A submission that does not visibly address it is capped at 15/25 on "Does It Work".

  - type: input
    id: closes-at
    attributes:
      label: Voting closes at
      placeholder: "2026-08-22 05:30 CDT"
    validations:
      required: true

  - type: dropdown
    id: announced-winner
    attributes:
      label: "[Organizer] Winning twist — fill in after voting closes"
      options:
        - "P1 — Battery Only"
        - "P2 — Solar Powered"
        - "P3 — 5mW Budget"
        - "C1 — No WiFi"
        - "C2 — Offline Only"
        - "C3 — One-Wire Output"
        - "M1 — No Screws"
        - "M2 — 100mm Cube Max"
        - "M3 — Repurposed Enclosure"
        - "$1 — $15 BOM Cap"
        - "$2 — 3-Component Rule"
        - "$3 — No Microcontroller"
        - "S1 — Add Accessibility"
        - "S2 — Child Safe"
        - "S3 — Rental Friendly"
        - "S4 — Fail Safe Mode"
    validations:
      required: false

  - type: textarea
    id: vote-tally
    attributes:
      label: "[Organizer] Vote tally"
      description: Record the count, any voided ballots, and the tiebreak if there was one.
      placeholder: |
        M2: 2 votes
        S3: 1 vote
        Voided: none
        Winner: M2 — 100mm Cube Max

  - type: markdown
    attributes:
      value: |
        ---
        **After announcing:** set `WINNING_TWIST` in `docs/app.js` to the winning ID and push,
        so the dashboard reflects it.
